name: Build

on:
  push:
    branches: [ master, multi ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.20.1", "1.20.4", "1.21.1", "1.21.11", "1.20.1-forge" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Switch the tree to Minecraft ${{ matrix.mc }}
        run: python3 scripts/apply_version.py ${{ matrix.mc }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.jvmargs=-Xmx3G

      - name: Inspect jar
        if: matrix.mc == '1.20.1-forge'
        run: |
          J=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)
          echo "JAR $J"
          unzip -l "$J" | grep -E "META-INF/|refmap|mixins.json|pack.mcmeta|fabric.mod|accesstransformer" | head -30
          unzip -p "$J" META-INF/mods.toml | head -30
          unzip -p "$J" bbs.mixins.json | head -20
          unzip -p "$J" bbs.client.mixins.json | grep -c '"' || true
          unzip -p "$J" META-INF/MANIFEST.MF

      - name: Smoke test the Forge client (headless)
        if: matrix.mc == '1.20.1-forge'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 > /dev/null
          mkdir -p run
          echo "eula=true" > run/eula.txt
          (timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon > smoke.log 2>&1 || true)
          echo "=== lines of interest ==="
          grep -nE "Mixin|mixin|ERROR|FATAL|Exception|Caused by|bbs|BBS|Registry|Failed|crash" smoke.log | grep -v "^.*Downloading" | head -150
          echo "=== tail ==="
          tail -40 smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: bbs-re-${{ matrix.mc }}
          path: build/libs/*.jar
