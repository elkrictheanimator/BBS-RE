name: Build

on:
  push:
    branches: [ master, multi ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.20.1", "1.20.4", "1.21.1" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Switch the tree to Minecraft ${{ matrix.mc }}
        run: python3 scripts/apply_version.py ${{ matrix.mc }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.jvmargs=-Xmx3G

      - uses: actions/upload-artifact@v4
        with:
          name: bbs-re-${{ matrix.mc }}
          path: build/libs/*.jar
