plugins {
	id 'dev.architectury.loom' version '1.7-SNAPSHOT'
}

version = project.mod_version + "-" + minecraft_version + "-forge"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.architectury.dev/" }
	maven { url = "https://maven.minecraftforge.net/" }
}

/* Forge has no split client/server source sets, so the client sources join the one source set. */
sourceSets {
	main {
		java.srcDir 'src/client/java'
		resources.srcDir 'src/client/resources'
	}
}

loom {
	silentMojangMappingsLicense()

	accessWidenerPath = file("src/main/resources/bbs.accesswidener")

	forge {
		convertAccessWideners = true
		extraAccessWideners.add "bbs.accesswidener"
		mixinConfigs = ["bbs.mixins.json", "bbs.client.mixins.json"]
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.forge_version}"

	/* MixinExtras is bundled (jar-in-jar) so the Forge build does not depend on the version Forge ships. */
	implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5"))
	include(implementation("io.github.llamalad7:mixinextras-forge:0.3.5"))
}

processResources {
	inputs.property "version", project.mod_version + "-" + project.minecraft_version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.mod_version + "-" + project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "20000"]
}
